    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only

      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.

    const resourceBlobs = {};

    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {

      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;

        if (ownFrameWindows().indexOf(e.source) < 0) return;

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach

        // Text is accepted only from the direct parent — the document

    setStatus('Unpacking ' + uuids.length + ' assets...');

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {

    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);

      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"3e342b42-0c05-4967-ab30-626bf5dc1116\"><\/script>\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<title>Race Leaderboard · A Pit Lane of Ferrari<\/title>\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"mobile-web-app-capable\" content=\"yes\">\n<meta name=\"theme-color\" content=\"#FFFFFF\">\n\n\n<style>\n@font-face{font-family:'HP Forma';src:url(\"5aff5350-83b3-418e-a20b-7f8550a36d5c\") format('truetype');font-weight:400;font-display:block}\n@font-face{font-family:'HP Forma';src:url(\"145e0c98-87b9-4165-851e-ee73527ba498\") format('truetype');font-weight:500;font-display:block}\nhtml,body{margin:0;height:100%;background:#FFFFFF;overflow:hidden;-webkit-font-smoothing:antialiased}\n*{box-sizing:border-box}\na{color:#0D1B3E;text-decoration:none}a:hover{color:#D40000}\nbutton{font-family:inherit}\n@keyframes lb-pulse{0%,100%{opacity:1}50%{opacity:.25}}\n<\/style>\n<script src=\"58590ff0-7618-4834-8ab8-52bc9b1cdae4\"><\/script>\n<\/helmet>\n<div style=\"position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:#FFFFFF;background-image:linear-gradient(135deg,transparent calc(50% - 34px),#1140D8 calc(50% - 34px) calc(50% + 34px),transparent calc(50% + 34px)),linear-gradient(135deg,transparent calc(50% - 34px),#1140D8 calc(50% - 34px) calc(50% + 34px),transparent calc(50% + 34px));background-repeat:no-repeat,no-repeat;background-size:210px 118px,210px 118px;background-position:top left 240px,top left 400px;color:#0D1B3E;font-family:'HP Forma','Helvetica Neue',Arial,sans-serif;font-variant-numeric:tabular-nums\">\n\n<header style=\"display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:32px;height:96px;padding:0 clamp(24px,3.4vw,64px);border-bottom:1px solid rgba(13,27,62,.1)\">\n  <img src=\"a9e5a3d7-1b80-4124-9e67-9b207b6211df\" alt=\"Scuderia Ferrari HP\" style=\"height:44px;width:auto;display:block\">\n  <div style=\"display:flex;flex-direction:column;align-items:center;gap:4px\">\n    <span style=\"font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#D40000\">Station 05<\/span>\n    <span style=\"font-size:20px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;white-space:nowrap\">Race Leaderboard<\/span>\n  <\/div>\n  <div style=\"display:flex;justify-content:flex-end;align-items:center;gap:24px\">\n    <span style=\"display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#5B6B7F\">{{ liveDot }} Live<\/span>\n    <div style=\"display:grid;grid-template-columns:auto auto;border:1px solid rgba(13,27,62,.24)\">\n      <button sc-camel-on-click=\"{{ setToday }}\" style=\"height:42px;padding:0 16px;border:none;background:{{ todayBg }};color:{{ todayFg }};font-size:12px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer\">Today<\/button>\n      <button sc-camel-on-click=\"{{ setAll }}\" style=\"height:42px;padding:0 16px;border:none;background:{{ allBg }};color:{{ allFg }};font-size:12px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer\">All time<\/button>\n    <\/div>\n    <button sc-camel-on-click=\"{{ toggleFs }}\" style=\"height:42px;padding:0 16px;background:transparent;border:1px solid rgba(13,27,62,.24);color:#0D1B3E;font-size:12px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer\" style-hover=\"border-color:#0D1B3E\">{{ fsLabel }}<\/button>\n  <\/div>\n<\/header>\n\n<main style=\"display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(28px,4vw,80px);min-height:0;padding:clamp(24px,3.4vw,60px) clamp(24px,3.4vw,64px);overflow:hidden\">\n  <section style=\"display:grid;grid-template-rows:minmax(0,1.35fr) minmax(0,1fr);gap:clamp(12px,1.2vw,20px);min-height:0\">\n    <div style=\"position:relative;background:#D40000;padding:clamp(24px,2.6vw,48px);display:flex;flex-direction:column;justify-content:space-between;gap:20px;min-height:0;overflow:hidden\">\n      <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:16px\">\n        <span style=\"font-size:14px;letter-spacing:.24em;text-transform:uppercase\">Pole position<\/span>\n        <span style=\"font-size:14px;letter-spacing:.16em;text-transform:uppercase\">Car {{ p1.num }}<\/span>\n      <\/div>\n      <span style=\"position:absolute;right:-.04em;bottom:-.2em;font-size:clamp(121px,13.2vw,253px);line-height:1;font-weight:500;letter-spacing:-.06em;color:rgba(11,11,12,.16);pointer-events:none\">01<\/span>\n      <div style=\"position:relative;display:flex;flex-direction:column;gap:14px;min-width:0\">\n        <span style=\"font-size:clamp(24.2px,2.53vw,50.6px);line-height:.88;font-weight:500;letter-spacing:-.03em;text-transform:uppercase;overflow-wrap:anywhere\">{{ p1.name }}<\/span>\n        <span style=\"font-size:clamp(30.8px,3.3vw,66px);line-height:.85;font-weight:500;letter-spacing:-.04em\">{{ p1.scoreFmt }}<\/span>\n      <\/div>\n    <\/div>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,1.2vw,20px);min-height:0\">\n      <sc-for list=\"{{ p23 }}\" as=\"p\" hint-placeholder-count=\"2\">\n        <div style=\"background:#EEF4FB;border:1px solid rgba(13,27,62,.12);padding:clamp(18px,2vw,32px);display:flex;flex-direction:column;justify-content:space-between;gap:14px;min-width:0;min-height:0;overflow:hidden\">\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px\">\n            <span style=\"font-size:clamp(26px,2.34vw,46.8px);line-height:.85;font-weight:500;letter-spacing:-.04em;color:#D40000\">{{ p.rank }}<\/span>\n            <span style=\"font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#5B6B7F\">Car {{ p.num }}<\/span>\n          <\/div>\n          <div style=\"display:flex;flex-direction:column;gap:10px;min-width:0\">\n            <span style=\"font-size:clamp(18.04px,1.64vw,29.52px);line-height:.95;font-weight:500;text-transform:uppercase;overflow-wrap:anywhere\">{{ p.name }}<\/span>\n            <span style=\"font-size:clamp(24px,2.25vw,42px);line-height:.85;font-weight:500;letter-spacing:-.03em\">{{ p.scoreFmt }}<\/span>\n          <\/div>\n        <\/div>\n      <\/sc-for>\n    <\/div>\n  <\/section>\n\n  <section style=\"display:flex;flex-direction:column;min-height:0\">\n    <div style=\"display:grid;grid-template-columns:minmax(56px,.7fr) minmax(0,3.4fr) minmax(48px,.6fr) minmax(96px,1.1fr);gap:16px;padding:0 0 14px;border-bottom:1px solid rgba(13,27,62,.3)\">\n      <span style=\"font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#6B7A8D\">Pos<\/span>\n      <span style=\"font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#6B7A8D\">Driver<\/span>\n      <span style=\"font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#6B7A8D\">Car<\/span>\n      <span style=\"font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#6B7A8D;text-align:right\">Score<\/span>\n    <\/div>\n    <div style=\"display:flex;flex-direction:column;flex:1;min-height:0\">\n      <sc-for list=\"{{ rows }}\" as=\"r\" hint-placeholder-count=\"9\">\n        <div style=\"flex:1;max-height:92px;min-height:52px;display:grid;grid-template-columns:minmax(56px,.7fr) minmax(0,3.4fr) minmax(48px,.6fr) minmax(96px,1.1fr);gap:16px;align-items:center;border-bottom:1px solid rgba(13,27,62,.1);background:{{ r.bg }}\">\n          <span style=\"font-size:clamp(18px,1.65vw,30px);font-weight:500;letter-spacing:-.02em;color:{{ r.rankFg }};padding-left:{{ r.pad }}\">{{ r.rank }}<\/span>\n          <span style=\"display:flex;align-items:center;gap:14px;min-width:0\"><span style=\"font-size:clamp(16.4px,1.48vw,26.24px);font-weight:500;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ r.name }}<\/span><sc-if value=\"{{ r.isNew }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"flex:none;font-size:11px;letter-spacing:.2em;text-transform:uppercase;background:#D40000;padding:5px 8px\">New<\/span><\/sc-if><\/span>\n          <span style=\"font-size:clamp(18px,1.5vw,26px);color:#5B6B7F\">{{ r.num }}<\/span>\n          <span style=\"font-size:clamp(18px,1.65vw,30px);font-weight:500;letter-spacing:-.02em;text-align:right;padding-right:{{ r.pad }}\">{{ r.scoreFmt }}<\/span>\n        <\/div>\n      <\/sc-for>\n    <\/div>\n  <\/section>\n<\/main>\n\n<footer style=\"display:flex;justify-content:space-between;align-items:center;gap:24px;height:64px;padding:0 clamp(24px,3.4vw,64px);border-top:1px solid rgba(13,27,62,.1)\">\n  <span style=\"font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#6B7A8D;white-space:nowrap\">A Pit Lane of Ferrari · Powered by HP<\/span>\n  <span style=\"font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#5B6B7F;white-space:nowrap\">{{ countLabel }}<\/span>\n  <a href=\"Pit Lane.dc.html\" style=\"white-space:nowrap;font-size:12px;letter-spacing:.2em;text-transform:uppercase\">Start your journey →<\/a>\n<\/footer>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;rows&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:9,&quot;min&quot;:5,&quot;max&quot;:15,&quot;step&quot;:1,&quot;tsType&quot;:&quot;number&quot;}}\">class Component extends DCLogic {\n  state={all:false,fs:false,tick:0};\n  componentDidMount(){\n    this.iv=setInterval(()=>this.setState(s=>({tick:s.tick+1})),3000);\n    this.onStore=()=>this.setState(s=>({tick:s.tick+1}));window.addEventListener('storage',this.onStore);\n    this.onFs=()=>this.setState({fs:!!document.fullscreenElement});document.addEventListener('fullscreenchange',this.onFs);\n    const w=setInterval(()=>{if(window.PitLane){clearInterval(w);this.onStore();}},50);\n  }\n  componentWillUnmount(){clearInterval(this.iv);window.removeEventListener('storage',this.onStore);document.removeEventListener('fullscreenchange',this.onFs);}\n  renderVals(){\n    const P=window.PitLane,n=this.props.rows??9;\n    const t0=new Date();t0.setHours(0,0,0,0);\n    let list=P?P.Store.ranked():[];\n    if(!this.state.all){const today=list.filter(e=>e.ts>=t0.getTime());if(today.length>=3)list=today;}\n    const fmt=v=>Number(v||0).toLocaleString('en-IN');\n    const pr=(e,i)=>({rank:String(i+1).padStart(2,'0'),name:e?e.name:'—',num:e?e.num||'—':'—',scoreFmt:e?fmt(e.score):'—',isNew:!!e&&!e.seed&&Date.now()-e.ts<5*60e3});\n    const rows=list.slice(3,3+n).map((e,i)=>{const r=pr(e,i+3);return {...r,bg:r.isNew?'rgba(212,0,0,.14)':'transparent',rankFg:r.isNew?'#F4F2EE':'#A7A39C',pad:r.isNew?'14px':'0px'};});\n    const on=(a)=>a?{bg:'#F4F2EE',fg:'#0B0B0C'}:{bg:'transparent',fg:'#D9D5CE'};\n    return {\n      p1:pr(list[0],0),p23:[pr(list[1],1),pr(list[2],2)],rows,\n      todayBg:on(!this.state.all).bg,todayFg:on(!this.state.all).fg,allBg:on(this.state.all).bg,allFg:on(this.state.all).fg,\n      setToday:()=>this.setState({all:false}),setAll:()=>this.setState({all:true}),\n      fsLabel:this.state.fs?'Exit fullscreen':'Fullscreen',\n      toggleFs:()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{});},\n      liveDot:React.createElement('span',{style:{width:8,height:8,borderRadius:'50%',background:'#2fbf71',display:'inline-block',animation:'lb-pulse 1.6s ease-in-out infinite'}}),\n      countLabel:`${list.length} drivers ranked`\n    };\n  }\n}<\/script>\n\n\n<\/body><\/html>"</script>
