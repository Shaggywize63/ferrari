name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Deploy via rsync over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PATH: ${{ secrets.SSH_PATH }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          echo "$SSH_PRIVATE_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          # /.htaccess is excluded: the server copy holds settings added on the server
          # (e.g. DB credentials via SetEnv) and must never be overwritten or deleted;
          # the same goes for /config/local.php (server-only settings, see config/local.example.php).
          # Changes to .htaccess in the repo therefore need to be applied on the server by hand.
          rsync -avz --delete \
            --exclude='/.htaccess' \
            --exclude='/config/local.php' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='qrcodes/*.png' \
            --exclude='.env' \
            --exclude='setup.php' \
            -e "ssh -i /tmp/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=no" \
            ./ "$SSH_USER@$SSH_HOST:$SSH_PATH/"

          # Ensure qrcodes dir exists and is writable on server
          ssh -i /tmp/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=no \
            "$SSH_USER@$SSH_HOST" \
            "mkdir -p $SSH_PATH/qrcodes && chmod 755 $SSH_PATH/qrcodes"

          rm /tmp/deploy_key
